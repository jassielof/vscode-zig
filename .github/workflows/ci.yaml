name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
  build:
    name: Build Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
      - name: Install dependencies
        run: npm install
      - name: Build extension
        run: npm run build
      - name: Package extension
        run: npx vsce package --baseContentUrl https://codeberg.org/ziglang/vscode-zig
